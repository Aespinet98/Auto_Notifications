name: kailas-stock-check
on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min (UTC). Minimo real de GitHub: ~5 min
  workflow_dispatch:          # permite lanzarlo a mano

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python check_stock.py
